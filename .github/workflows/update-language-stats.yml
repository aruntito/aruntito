name: Update language statistics

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/update_language_stats.py"
      - ".github/workflows/update-language-stats.yml"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate language statistics
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/update_language_stats.py

      - name: Commit updated card
        run: |
          if [[ -n "$(git status --porcelain assets/most-used-languages.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/most-used-languages.svg
            git commit -m "Update most used languages card"
            git push
          fi
